# Optional production-like local stack (Postgres + backend + frontend),
# matching the layout suggested in docs/README.md. Day-to-day local
# development does not require this — see docs/SETUP.md for the
# zero-Docker path (SQLite, `uvicorn` + `npm run dev`).
#
# Usage: docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apoe
      POSTGRES_PASSWORD: apoe
      POSTGRES_DB: apoe
    ports:
      - "5432:5432"
    volumes:
      - apoe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apoe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://apoe:apoe@postgres:5432/apoe
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  apoe_postgres_data:
